<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>InvestFront — alpha</title>
<meta name="description" content="InvestFront : investissez dans les commerces et l'immobilier de France, encaissez dividendes et loyers, montez votre holding.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%88%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<style>
:root{--bg:#0e141b;--panel:#151d27;--panel2:#1c2633;--line:#2a3646;--tx:#e8eef5;--mut:#8fa1b5;--acc:#35d39a;--gold:#f6c343;--red:#ff6b6b;--blue:#5aa9ff}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
header{display:flex;align-items:center;gap:16px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:nowrap}
.brand{font-weight:800;font-size:17px;letter-spacing:.2px;white-space:nowrap}
.brand i{font-style:normal;color:var(--acc)}
.tag{font-size:10px;font-weight:700;background:var(--gold);color:#222;border-radius:4px;padding:1px 5px;margin-left:4px;vertical-align:2px;text-transform:uppercase}
.stat{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.stat small{color:var(--mut);font-size:11px;white-space:nowrap}
.stat b{font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.grow{flex:1}
.speed{display:flex;gap:4px}
.speed button{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 9px;cursor:pointer;min-width:38px;font-size:13px}
.speed button.on{background:var(--acc);color:#06281b;border-color:var(--acc);font-weight:700}
main{flex:1;display:flex;min-height:0}
#panel{width:410px;max-width:100%;display:flex;flex-direction:column;position:relative;background:var(--panel);border-right:1px solid var(--line);min-height:0}
#tabs{display:flex;border-bottom:1px solid var(--line)}
#tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:8px 2px 6px;cursor:pointer;color:var(--mut);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:1px}
#tabs button span{font-size:17px}
#tabs button.on{color:var(--tx);border-bottom-color:var(--acc)}
#view{flex:1;overflow:auto;padding:12px;min-height:0}
#card{position:absolute;inset:0;background:var(--panel);overflow:auto;padding:12px;z-index:5}
#map{flex:1;z-index:0;background:#dfe7ee;min-height:0}
h3{margin:16px 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--mut)}
h3:first-child{margin-top:0}
.box{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.box h4{margin:0 0 6px;font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.kpi{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 8px}
.kpi small{display:block;color:var(--mut);font-size:11px}
.kpi b{font-size:14px;font-variant-numeric:tabular-nums}
.pos{color:var(--acc)}.neg{color:var(--red)}.gold{color:var(--gold)}.mut{color:var(--mut)}
.row{display:flex;align-items:center;gap:9px;padding:8px 6px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:6px}
.row:hover{background:var(--panel2)}
.row .em{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:15px;flex:none}
.row .nm{flex:1;min-width:0}
.row .nm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.row .nm small{color:var(--mut);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rt{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.row .rt small{display:block;color:var(--mut)}
.line{display:flex;justify-content:space-between;gap:10px;padding:3px 0;font-variant-numeric:tabular-nums}
.line.tot{border-top:1px solid var(--line);margin-top:4px;padding-top:6px;font-weight:700}
.btn{background:var(--acc);color:#06281b;border:0;border-radius:8px;padding:9px 12px;font-weight:700;cursor:pointer;width:100%}
.btn:disabled{background:#3a4656;color:#8b98a8;cursor:not-allowed}
.btn.sec{background:var(--panel);color:var(--tx);border:1px solid var(--line)}
.btn.red{background:var(--red);color:#2b0606}
.btn.sm{width:auto;padding:6px 10px;font-size:13px}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 10px;cursor:pointer;font-size:12px;white-space:nowrap}
.chip.on{background:var(--blue);border-color:var(--blue);color:#041a33;font-weight:700}
input[type=range]{width:100%;accent-color:var(--acc);margin:6px 0}
select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.qrow{display:flex;justify-content:space-between;align-items:baseline;font-size:15px}
small{color:var(--mut)}
.cmp{margin:6px 0 10px}
.cmp .lab{display:flex;justify-content:space-between;font-size:12px}
.bar{height:8px;background:var(--panel);border-radius:5px;position:relative;margin-top:3px;border:1px solid var(--line)}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--blue)}
.bar u{position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:var(--gold)}
.hd{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.hd .em{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:22px;flex:none}
.hd h2{margin:0;font-size:17px;line-height:1.2}
.hd .x{margin-left:auto;background:var(--panel2);border:1px solid var(--line);border-radius:8px;width:34px;height:34px;cursor:pointer;flex:none;font-size:15px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:11px;color:var(--mut);font-weight:600;text-align:right;padding:4px 4px;border-bottom:1px solid var(--line)}
td{padding:6px 4px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
tr.clk{cursor:pointer}tr.clk:hover{background:var(--panel2)}
.goal{display:flex;gap:8px;padding:3px 0}.goal.ok{color:var(--mut);text-decoration:line-through}
.log{font-size:12.5px;padding:4px 0;border-bottom:1px dashed var(--line)}
.log small{margin-right:6px}
.prog{height:6px;background:var(--panel);border-radius:4px;overflow:hidden;margin-top:6px}.prog i{display:block;height:100%;background:var(--gold)}
.pips{letter-spacing:2px;color:var(--gold)}
.lock{color:var(--mut);font-size:12.5px}
#toasts{position:fixed;right:12px;bottom:28px;display:flex;flex-direction:column;gap:6px;z-index:900;max-width:min(360px,calc(100vw - 24px));pointer-events:none}
.toast{background:#0b1118ee;border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:8px;padding:8px 11px;font-size:13px;box-shadow:0 6px 20px #0008;animation:tin .25s}
.toast.bad{border-left-color:var(--red)}.toast.gold{border-left-color:var(--gold)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
#modal{position:fixed;inset:0;background:#000a;z-index:1000;display:grid;place-items:center;padding:16px}
#modal[hidden]{display:none}
#modal .in{background:var(--panel);border:1px solid var(--line);border-radius:14px;max-width:560px;width:100%;max-height:90dvh;overflow:auto;padding:20px}
#modal h2{margin:0 0 8px}
#modal li{margin:5px 0}

.mk.own{border-color:var(--gold);box-shadow:0 0 0 3px #f6c34388,0 1px 5px #0007}
.mk.sel{outline:3px solid #111;outline-offset:2px}
.mk.sq{border-radius:8px}
.mapbtns{display:flex;gap:6px;flex-wrap:wrap}
.mapbtns button{background:#fff;color:#1a2636;border:0;border-radius:8px;padding:6px 10px;font-weight:700;font-size:12px;box-shadow:0 1px 5px #0006;cursor:pointer}
.mk em{position:absolute;right:-9px;top:-9px;font-style:normal;font-size:12px}
.mk s{position:absolute;left:50%;bottom:-13px;transform:translateX(-50%);text-decoration:none;background:var(--gold);color:#222;font-size:10px;font-weight:700;border-radius:6px;padding:0 4px;white-space:nowrap}
.cb{border-radius:50%;background:#1d5fd0d9;color:#fff;display:grid;place-items:center;font-weight:800;border:2px solid #fff;box-shadow:0 2px 8px #0006;cursor:pointer;width:100%;height:100%;font-size:13px}
.cb.own{background:#b8860bea;border-color:var(--gold)}
.cl{position:absolute;top:100%;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:11px;font-weight:700;color:#14233a;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff;pointer-events:none}
.leaflet-div-icon{background:none;border:0}
.leaflet-container{font:inherit}
@media(max-width:820px){
  header{gap:6px 10px;padding:6px 8px;flex-wrap:wrap;justify-content:space-between}
  .brand,.grow,.stat.opt{display:none}
  .mapbtns{gap:4px}.mapbtns button{font-size:11px;padding:4px 7px}
  .stat b{font-size:13px}.stat small{font-size:10px}
  .speed{width:100%}.speed button{flex:1;padding:5px 6px}
  main{flex-direction:column-reverse}
  #panel{width:auto;height:56%;border-right:0;border-top:1px solid var(--line)}
}
</style>
</head>

function place(C,out){
  const R=(.8+Math.sqrt(C.p)*.09)*(1+.2*(C.x-1));let la=C.la,lo=C.lo;
  for(let i=0;i<30;i++){
    const d=out?R*(.75+.6*Math.random()):R*Math.pow(Math.random(),.65),th=Math.random()*360;
    if(C.sea!=null&&d>.4){let a=Math.abs(th-C.sea)%360;if(a>180)a=360-a;if(a<95)continue;}
    la=C.la+d*Math.cos(th*Math.PI/180)/111.2;lo=C.lo+d*Math.sin(th*Math.PI/180)/(111.2*Math.cos(C.la*Math.PI/180));break;
  }
  return [+la.toFixed(5),+lo.toFixed(5)];
}
const bizTarget=C=>Math.round(clamp(5+Math.sqrt(C.p)*1.05,8,54)*C.x);
const reF=C=>Math.max(.35,(.6+.45*Math.log10(C.p/40))*(C.n==='Paris'?2.2:1)*(1+.4*C.t));
const reYAdj=C=>clamp(1.25-.25*reF(C),.6,1.15);
function genRe(ci){
  const C=CITIES[ci];const ws=[['shop',36],['flat',28],['office',C.p>150?16:8],['ware',10],['land',14]];
  let r=Math.random()*ws.reduce((a,w)=>a+w[1],0),k='shop';for(const w of ws){r-=w[1];if(r<=0){k=w[0];break;}}
  const T=RE[k],pf=reF(C),[la,lo]=place(C,k==='ware'||k==='land');
  const val=T.v*pf*Math.exp(randn()*.45),y=T.y*reYAdj(C)*Math.exp(randn()*.12);
  return {id:G.rid++,k,c:ci,la,lo,n:(1+Math.floor(Math.random()*98))+' '+pick(WAYS)+' '+pick(PLACES),val,rent:val*y,
    occ:k==='flat'?clamp(.95+randn()*.04,.6,1):k==='land'?1:(Math.random()<.9?1:0),st:k==='land'?1:clamp(.75+randn()*.15,.3,1),
    surf:Math.max(20,Math.round(val/(T.ppm*pf)/5)*5),own:0,cost:0,since:null,rents:0,bl:0,bk:null,bcost:0};
}
/* Complète le monde : sert à la création d'une partie et à la mise à niveau d'une ancienne sauvegarde. */
function ensureWorld(){
  const nb=CITIES.map(()=>0),nr=CITIES.map(()=>0);
  for(const b of G.biz)nb[b.c]++;for(const r of G.re)nr[r.c]++;
  CITIES.forEach((C,ci)=>{const n=bizTarget(C);for(let i=nb[ci];i<n;i++)G.biz.push(genBiz(ci,false));
    const m=Math.round(n*.4);for(let i=nr[ci];i<m;i++)G.re.push(genRe(ci));});
}
function upgrade(){
  if(G.v>=2)return;
  G.re=G.re||[];G.rid=G.rid||1;G.staff.immo=G.staff.immo||0;G.totRent=0;G.qRent=0;G.nBuild=0;
  ensureWorld();G.v=2;upgraded=true;
  log('🆕 Nouveautés : immobilier (bâtiments et terrains à louer ou à bâtir) et région Centre-Val de Loire densifiée');
}
function genBiz(ci,fresh){
  const C=CITIES[ci];
  let tot=0;const ws=SK.map(k=>{let w=SECT[k].w;if(C.t&&SECT[k].tour)w*=1+C.t;
    if(k==='cine'&&C.p<400&&G.biz.some(b=>b.c===ci&&b.s==='cine'))w=0;tot+=w;return w;});
  let r=Math.random()*tot,s=SK[0];for(let i=0;i<SK.length;i++){r-=ws[i];if(r<=0){s=SK[i];break;}}
  const S=SECT[s];
  const [la,lo]=place(C,false);
  let name='';
  for(let i=0;i<12;i++){const p=pick(S.nm);name=p.includes('{p}')?p.replace('{p}',pick(PRENOMS)):p+' '+pick(PLACES);
    if(!G.biz.some(b=>b.c===ci&&b.n===name))break;}
  const cf=(.85+.2*Math.log10(C.p/40))*(C.n==='Paris'?1.15:1);
  const q=clamp(.5+randn()*.22,0,1);
  const tr=.012+(q-.5)*.05+randn()*.03;
  const ca=Math.max(40000,S.ca*cf*Math.exp(randn()*.4)*(S.tour&&C.t?1+.35*C.t:1));
  const mg=S.mg*(-.1+2.2*q)+randn()*.008;
  const mx=Math.random();
  const yr=YEAR0+Math.floor(G.t/360);
  const h=[];for(let k=24;k>=0;k--)h.push(Math.round(ca*Math.pow(1+tr,-k/12)*(1+randn()*.012)/1000));
  return {id:G.nid++,n:name,s,c:ci,la,lo,ca,mg,ma:mg,tr,q,
    pay:Math.round((.3+Math.random()*.4)*20)/20,max:mx<.65?100:mx<.9?49:20,
    tre:ca*Math.random()*.08,res:0,own:0,cost:0,since:null,divs:0,mk:0,rn:0,warn:false,
    boss:pick(PRENOMS)+' '+pick(NOMS),yr:fresh?yr:yr-1-Math.floor(Math.pow(Math.random(),2)*40),h};
}

const byId=id=>G.biz.find(b=>b.id===id);
const stakes=()=>G.biz.filter(b=>b.own>0);
function g12(b){const h=b.h;return h.length>12?h[h.length-1]/h[h.length-13]-1:.02;}
function valo(b){const S=SECT[b.s];const gf=clamp(1+(g12(b)-.02)*2.5,.7,1.6);
  return Math.max(b.ca*.2,b.ca*Math.max(b.ma,0)*S.per*gf)+Math.max(b.tre,0);}
const yld=b=>Math.max(0,b.ca*b.ma)*b.pay/valo(b);
const debt=()=>G.loans.reduce((a,L)=>a+L.bal,0);
const portVal=()=>stakes().reduce((a,b)=>a+valo(b)*b.own/100,0);
const myRe=()=>G.re.filter(r=>r.own);
const reVal=()=>G.re.reduce((a,r)=>a+(r.own?r.val:0),0);
const reGross=r=>r.bl>0?0:r.rent*(.8+.2*r.st)*(r.own?1+.03*G.staff.immo:1);
const reNet=r=>r.bl>0?0:reGross(r)*r.occ*(1-RE[r.k].ch)-(1-r.occ)*r.val*.01;
const reYield=r=>r.rent*(.8+.2*r.st)/r.val;
const rentTax=()=>G.holding?.25*taxMult():.30;
const estRent=r=>{const n=reNet(r);return n>0?n*(1-rentTax()):n;};
const estRentAll=()=>myRe().reduce((a,r)=>a+estRent(r),0);
const mortRate=()=>Math.max(1,G.rate+1.4-(G.holding?.3:0)-G.staff.cfo*.4);
function quoteRe(r){const fees=r.val*RE_FEES,total=r.val+fees,loan=Math.floor(r.val*MORT_LTV/1000)*1000,rate=mortRate();
  return {fees,total,loan,down:total-loan,rate,pay:annuity(loan,rate,MORT_YEARS*12)};}
function quoteSellRe(r){const gross=r.val*(1-RE_SELL),gain=gross-r.cost,tax=Math.max(0,gain)*rentTax();return {gross,gain,tax,net:gross-tax};}
const stLabel=r=>r.k==='land'?'—':r.st>=.85?'Excellent':r.st>=.65?'Bon':r.st>=.45?'Moyen':'Vétuste';
const netWorth=()=>G.cash+portVal()+reVal()-debt();
const taxMult=()=>G.holding?1-.15*G.staff.tax:1;
function divTax(own){if(!G.holding)return .30;return (own>=5?.0125:.25)*taxMult();}
function pvTax(b){if(!G.holding)return .30;const held=b.since!=null&&G.t-b.since>=720;return (b.own>=5&&held?.03:.25)*taxMult();}
const estDiv=b=>Math.max(0,b.ca*b.ma)*b.pay*b.own/100*(1-divTax(b.own));
const estDivAll=()=>stakes().reduce((a,b)=>a+estDiv(b),0);
const salaries=()=>Object.keys(ROLES).reduce((a,k)=>a+(G.staff[k]?ROLES[k].sal[G.staff[k]-1]:0),0);
const loanPay=()=>G.loans.reduce((a,L)=>a+L.pay,0);
const monthlyNet=()=>(estDivAll()+estRentAll())/12-loanPay()-salaries()-(G.holding?HOLD_FIX:0);
function loanCap(){const lf=1+(G.holding?.5:0)+G.staff.cfo*.25;
  return Math.max(0,Math.floor((lf*Math.max(0,netWorth())+MORT_LTV*reVal()+2.5*(estDivAll()+Math.max(0,estRentAll()))-debt())/1000)*1000);}
function loanRate(amt,yrs){const lev=(debt()+amt)/Math.max(netWorth(),1);
  return Math.max(1,G.rate+2-(G.holding?.3:0)-G.staff.cfo*.4+lev*.5+(yrs-3)*.08);}
const annuity=(P,r,n)=>{const i=r/1200;return P*i/(1-Math.pow(1+i,-n));};
function quoteBuy(b,pct){const neg=G.staff.ana>=3;const price=valo(b)*pct/100*(neg?.97:1);
  const ctrl=(b.own<50&&b.own+pct>=50)?price*.10:0;const fees=(price+ctrl)*(neg?.02:.04);
  return {price,ctrl,fees,total:price+ctrl+fees};}
function quoteSell(b,pct){const gross=valo(b)*pct/100*.97;const basis=b.own?b.cost*pct/b.own:0;
  const gain=gross-basis;const tax=Math.max(0,gain)*pvTax(b);return {gross,basis,gain,tax,net:gross-tax};}
function computeStats(){SS={};SK.forEach(k=>SS[k]={n:0,ca:0,mg:0,yld:0,g:0,val:0});
  for(const b of G.biz){const s=SS[b.s];s.n++;s.ca+=b.ca;s.mg+=b.ma;s.yld+=yld(b);s.g+=g12(b);s.val+=valo(b);}
  SK.forEach(k=>{const s=SS[k],n=s.n||1;s.ca/=n;s.mg/=n;s.yld/=n;s.g/=n;s.val/=n;});}

function stepBiz(b,mi,sf,cf){
  const S=SECT[b.s];const ops=b.own>=25?G.staff.ops:0;
  const g=b.tr+G.macro*.04*S.cyc+(sf?sf[0]:0)+(cf?cf[0]:0)+ops*.01+(b.mk>0?.10:0);
  b.ca=Math.max(20000,b.ca*(1+g/12+randn()*S.vol/3.5));
  if(b.tre>0){const inv=b.tre*.04;b.tre-=inv;b.ca+=inv*(.2+.8*b.q);}
  const target=S.mg*(-.1+2.2*b.q)+(sf?sf[1]:0)+ops*.004+G.macro*.005*S.cyc;
  b.mg=clamp(b.mg+(target-b.mg)*.10+randn()*.004,-.2,.4);
  b.ma+=(b.mg-b.ma)*.3;
  b.tr+=((.012+(b.q-.5)*.05)-b.tr)*.05+randn()*.005;
  if(Math.random()<.006){b.q=clamp(b.q-.15,0,1);b.mg-=.03;b.res-=b.ca*.04*Math.exp(randn()*.8);}
  if(Math.random()<.004)b.q=clamp(b.q+.15,0,1);
  b.res+=b.ca/12*S.se[mi]*b.mg;
  b.h.push(Math.round(b.ca/1000));if(b.h.length>25)b.h.shift();
  if(b.mk>0)b.mk--;
}
function rollEvents(){
  if(Math.random()<.30){const pool=EV_SECT.filter(e=>!G.fx.some(f=>f.id===e.id));
    if(pool.length){const e=pick(pool);G.fx.push({id:e.id,t:e.t,sec:e.sec,left:e.m});news(e.t,'gold');}}
  if(Math.random()<.12){const e=pick(EV_CITY),ci=Math.floor(Math.random()*CITIES.length);
    if(!G.fx.some(f=>f.ci===ci)){const t=e.t.replace('{v}',CITIES[ci].n);G.fx.push({id:'c'+ci,t,ci,g:e.g,left:e.m});news(t,'gold');}}
  if(Math.random()<.07){const r=Math.random();
    if(r<.25){G.radj-=.5;news('📉 La banque centrale baisse ses taux : le crédit devient moins cher','gold');}
    else if(r<.5){G.radj+=.5;news('📈 La banque centrale relève ses taux : le crédit se renchérit','gold');}
    else if(r<.75){G.macro=clamp(G.macro-.5,-1,1);news('⛈️ Coup de froid sur l’économie : la consommation ralentit','bad');}
    else{G.macro=clamp(G.macro+.45,-1,1);news('🌤️ Embellie économique : les Français consomment davantage','gold');}}
}
function ownedEvents(){
  for(const b of stakes()){if(Math.random()>.03)continue;const r=Math.floor(Math.random()*6);
    if(r===0){b.ca*=1.05;news('📰 '+b.n+' : bel article dans la presse locale, la clientèle afflue');}
    else if(r===1){b.res-=b.ca*.02;news('🧯 '+b.n+' : dégât des eaux, une semaine de fermeture','bad');}
    else if(r===2){b.q=clamp(b.q+.1,0,1);news('🤝 '+b.n+' : une excellente recrue rejoint l’équipe');}
    else if(r===3){b.res-=b.ca*.01;news('🔍 '+b.n+' : contrôle administratif, une amende à payer','bad');}
    else if(r===4){b.tr+=.02;news('⭐ '+b.n+' : les avis clients sont excellents');}
    else{b.q=clamp(.5+randn()*.25,0,1);b.boss=pick(PRENOMS)+' '+pick(NOMS);news('👋 '+b.n+' : le gérant part à la retraite, '+b.boss+' prend la suite','gold');}}
}
function payDividends(){
  let net=0,tax=0;
  for(const b of G.biz){
    if(b.res>0){const div=b.res*b.pay;b.tre+=b.res-div;
      if(b.own>0){const gross=div*b.own/100,t=gross*divTax(b.own);net+=gross-t;tax+=t;b.divs+=gross-t;}}
    else b.tre+=b.res;
    b.res=0;
  }
  if(net>0){G.cash+=net;G.totDiv+=net;G.totTax+=tax;news('💶 Dividendes du trimestre : +'+eur(net,1)+' net (impôts : '+eur(tax,1)+')');}
}
function forcedSale(){
  const st=stakes().sort((a,b)=>valo(b)*b.own-valo(a)*a.own);
  while(G.cash<0&&st.length){const b=st.shift();const per=valo(b)*.85/100;
    const need=Math.min(b.own,Math.ceil(-G.cash/per));G.cash+=per*need;b.cost-=b.cost*need/b.own;b.own-=need;
    if(!b.own){b.cost=0;b.since=null;}
    news('🏦 La banque saisit et revend '+need+' % de '+b.n+' pour couvrir votre découvert','bad');mapDirty=true;}
  const rs=myRe().filter(r=>!r.bl).sort((a,b)=>b.val-a.val);
  while(G.cash<0&&rs.length){const r=rs.shift();G.cash+=r.val*.85;r.own=0;r.cost=0;r.since=null;
    news('🏦 La banque saisit et revend votre bien du '+r.n+' ('+CITIES[r.c].n+') pour couvrir votre découvert','bad');mapDirty=true;}
}
function finishBuild(r){
  const C=CITIES[r.c],T=RE[r.bk];r.k=r.bk;r.bk=null;r.val+=r.bcost*1.25;r.rent=r.val*T.y*reYAdj(C);r.st=1;
  r.occ=r.k==='flat'?.5:0;r.surf=Math.max(20,Math.round(r.val/(T.ppm*reF(C))/5)*5);r.bcost=0;mapDirty=true;
  news('🏗️ Chantier terminé : votre '+T.n.toLowerCase()+' du '+r.n+' ('+C.n+') est livré, les locataires peuvent arriver','gold');
}
function stepRe(r,cf){
  const T=RE[r.k];
  r.val*=1+(.02+(cf?cf[0]*.3:0)+G.macro*.02-(G.rate-3)*.012)/12+randn()*.004;
  r.rent*=1+(.018+G.macro*.01)/12;
  if(r.bl>0){r.bl--;if(!r.bl)finishBuild(r);return 0;}
  const im=r.own?G.staff.immo:0;
  if(r.k!=='land'){r.st=Math.max(.2,r.st-.0025);if(!r.own&&r.st<.6&&Math.random()<.04)r.st=1;}
  if(r.k==='flat')r.occ=clamp(r.occ+((.96-(1-r.st)*.15+G.macro*.02+im*.01)-r.occ)*.2+randn()*.02,.4,1);
  else if(T.single){
    if(r.occ){if(Math.random()<T.leave*(1-im*.25)*(1+Math.max(0,-G.macro))){r.occ=0;if(r.own)news('🚪 '+T.n+' du '+r.n+' ('+CITIES[r.c].n+') : le locataire s’en va','bad');}}
    else if(Math.random()<.18*(1+im*.3)*(.5+r.st/2)){r.occ=1;if(r.own)news('🔑 '+T.n+' du '+r.n+' ('+CITIES[r.c].n+') : un nouveau locataire signe le bail');}
  }
  if(!r.own)return 0;
  const net=reNet(r)/12,tax=Math.max(0,net)*rentTax();G.cash+=net-tax;r.rents+=net-tax;G.totTax+=tax;G.totRent+=net-tax;return net-tax;
}
function endMonth(){
  const mi=(Math.floor(G.t/30)+11)%12;
  G.macro=clamp(G.macro*.96+randn()*.09,-1,1);G.radj*=.97;G.rate=clamp(3+G.macro*1.2+G.radj,.5,7);
  rollEvents();
  const sf={},cf={};
  for(const f of G.fx){if(f.sec)for(const k in f.sec){const a=sf[k]||(sf[k]=[0,0]);a[0]+=f.sec[k][0];a[1]+=f.sec[k][1];}
    if(f.ci!=null){const a=cf[f.ci]||(cf[f.ci]=[0,0]);a[0]+=f.g;}}
  for(const b of G.biz)stepBiz(b,mi,sf[b.s],cf[b.c]);
  for(const r of G.re)G.qRent+=stepRe(r,cf[r.c]);
  G.fx.forEach(f=>f.left--);G.fx=G.fx.filter(f=>f.left>0);
  ownedEvents();
  if(mi%3===2){payDividends();if(G.qRent)news('🏠 Loyers du trimestre : '+sgn(G.qRent)+' net'+(G.qRent<0?' (vacance et charges)':''),G.qRent<0?'bad':'');G.qRent=0;}
  // charges
  for(const L of G.loans){const int=L.bal*L.rate/1200,pay=Math.min(L.pay,L.bal+int);G.cash-=pay;L.bal-=pay-int;L.n--;G.totInt+=int;}
  const done=G.loans.filter(L=>L.bal<=1);done.forEach(()=>news('✅ Un prêt est entièrement remboursé'));
  G.loans=G.loans.filter(L=>L.bal>1);
  G.cash-=salaries()+(G.holding?HOLD_FIX:0);
  // faillites
  for(const b of G.biz.filter(b=>{b.dz=b.tre<0?(b.dz||0)+1:0;return b.tre<-.06*b.ca&&b.dz>=4;})){
    if(b.own>0)news('💥 '+b.n+' ('+CITIES[b.c].n+') fait faillite : votre participation de '+b.own+' % est perdue','bad');
    G.biz.splice(G.biz.indexOf(b),1);G.biz.push(genBiz(b.c,true));
    if(ui.sel===b.id){ui.sel=null;}mapDirty=true;}
  for(const b of stakes()){
    if(b.tre<-.02*b.ca&&!b.warn){b.warn=true;news('⚠️ '+b.n+' est en difficulté : sa trésorerie est dans le rouge'+(b.own>=50?', recapitalisez-la':', pensez à vendre'),'bad');}
    else if(b.tre>=0)b.warn=false;}
  // découvert
  if(G.cash<0){G.cash*=1.01;G.neg++;
    if(G.neg===1)news('🚨 Votre compte est à découvert ! Sans régularisation sous 3 mois, la banque vendra vos parts','bad');
    if(G.neg>=3){forcedSale();if(G.cash<0&&!stakes().length&&!myRe().length){gameOver();return;}if(G.cash>=0)G.neg=0;}
  }else G.neg=0;
  computeStats();
  G.hist.push(Math.round(netWorth()));if(G.hist.length>360)G.hist.shift();
  checkGoals();
  if(mi%3===2)save();
  refresh(true);
}
function gameOver(){G.over=true;speed=0;save();
  modal(`<h2>💸 Faillite personnelle</h2><p>Plus de trésorerie, plus de participations ni de biens : la banque a tout repris. Vous aurez tenu jusqu’au ${dateStr()}.</p><button class="btn" data-a="reset2">Recommencer une partie</button>`);}

/* ---------- Actions du joueur ---------- */
function buy(){const b=byId(ui.sel);if(!b)return;const pct=clamp(ui.buy,1,b.max-b.own);if(pct<1)return;
  const q=quoteBuy(b,pct);if(q.total>G.cash){toast('Trésorerie insuffisante','bad');return;}
  G.cash-=q.total;if(!b.own)b.since=G.t;b.own+=pct;b.cost+=q.total;
  log('🛒 Achat de '+pct+' % de '+b.n+' ('+CITIES[b.c].n+') pour '+eur(q.total,1));
  toast('Vous détenez '+b.own+' % de '+b.n);ui.buy=Math.min(10,Math.max(1,b.max-b.own));ui.sell=b.own;after();}
function sell(){const b=byId(ui.sel);if(!b||!b.own)return;const pct=clamp(ui.sell,1,b.own);const q=quoteSell(b,pct);
  G.cash+=q.net;G.totTax+=q.tax;b.cost-=q.basis;b.own-=pct;if(!b.own){b.cost=0;b.since=null;}
  log('💼 Vente de '+pct+' % de '+b.n+' : '+eur(q.net,1)+' net (plus-value '+sgn(q.gain)+', impôt '+eur(q.tax,1)+')');
  toast('Vente encaissée : '+eur(q.net,1));ui.sell=Math.max(1,b.own);after();}
function marketing(){const b=byId(ui.sel);if(!b||b.own<50||b.mk>0)return;const c=b.ca*.04;if(c>G.cash)return toast('Trésorerie insuffisante','bad');
  G.cash-=c;b.cost+=c;b.mk=12;log('📣 Campagne marketing pour '+b.n+' ('+eur(c,1)+')');after();}
function renovate(){const b=byId(ui.sel);if(!b||b.own<50||G.t<b.rn)return;const c=b.ca*.12;if(c>G.cash)return toast('Trésorerie insuffisante','bad');
  G.cash-=c;b.cost+=c;b.q=clamp(b.q+.12,0,1);b.ca*=1.04;b.rn=G.t+1080;log('🏗️ Rénovation de '+b.n+' ('+eur(c,1)+')');after();}
function recap(){const b=byId(ui.sel);if(!b||b.tre>=0)return;const c=-b.tre;if(c>G.cash)return toast('Trésorerie insuffisante','bad');
  G.cash-=c;b.cost+=c;b.tre=0;b.warn=false;log('🩹 Recapitalisation de '+b.n+' ('+eur(c,1)+')');after();}
function createHolding(){if(G.holding||G.cash<HOLD_COST)return;G.cash-=HOLD_COST;G.holding=true;
  news('🏢 Votre holding est créée : vos participations y sont apportées, la fiscalité change','gold');after();}
function hire(k){if(!G.holding||G.staff[k]>=3)return;const c=ROLES[k].sal[G.staff[k]];if(c>G.cash)return toast('Trésorerie insuffisante','bad');
  G.cash-=c;G.staff[k]++;log(ROLES[k].e+' '+ROLES[k].n+' : niveau '+LVL[G.staff[k]]);after();}
function fire(k){if(!G.staff[k])return;const c=ROLES[k].sal[G.staff[k]-1]*2;G.cash-=c;G.staff[k]=0;
  log('📤 Départ du '+ROLES[k].n.toLowerCase()+' (indemnité '+eur(c,1)+')');after();}
function takeLoan(){const cap=loanCap();const amt=clamp(ui.loanAmt,0,cap);if(amt<5000)return;
  const yrs=ui.loanYrs,rate=loanRate(amt,yrs),n=yrs*12;
  G.loans.push({id:G.lid++,p0:amt,bal:amt,rate,n,pay:annuity(amt,rate,n)});G.cash+=amt;G.nLoans++;
  log('🏦 Prêt de '+eur(amt,1)+' sur '+yrs+' ans à '+nf(rate,2)+' %');toast('Prêt accordé : +'+eur(amt,1));ui.loanAmt=0;after();}
function repay(id){const L=G.loans.find(l=>l.id===id);if(!L||G.cash<L.bal)return toast('Trésorerie insuffisante','bad');
  G.cash-=L.bal;G.loans=G.loans.filter(l=>l!==L);log('✅ Remboursement anticipé d’un prêt ('+eur(L.bal,1)+')');after();}
const curRe=()=>G.re.find(r=>r.id===ui.selR);
function buyRe(mort){const r=curRe();if(!r||r.own)return;const q=quoteRe(r),need=mort?q.down:q.total;
  if(need>G.cash)return toast('Trésorerie insuffisante','bad');
  G.cash-=need;r.own=1;r.cost=q.total;r.since=G.t;
  if(mort){G.loans.push({id:G.lid++,p0:q.loan,bal:q.loan,rate:q.rate,n:MORT_YEARS*12,pay:q.pay,immo:1});G.nLoans++;}
  log('🏠 Achat : '+RE[r.k].n.toLowerCase()+' du '+r.n+' ('+CITIES[r.c].n+') pour '+eur(q.total,1)+(mort?', dont '+eur(q.loan,1)+' de prêt immobilier':''));
  toast('Vous êtes propriétaire : '+RE[r.k].n.toLowerCase()+', '+r.n);after();}
function sellRe(){const r=curRe();if(!r||!r.own||r.bl>0)return;const q=quoteSellRe(r);
  G.cash+=q.net;G.totTax+=q.tax;r.own=0;r.cost=0;r.since=null;
  log('🏠 Vente du bien du '+r.n+' ('+CITIES[r.c].n+') : '+eur(q.net,1)+' net (plus-value '+sgn(q.gain)+', impôt '+eur(q.tax,1)+')');
  toast('Vente encaissée : '+eur(q.net,1));after();}
function renoRe(){const r=curRe();if(!r||!r.own||r.k==='land'||r.bl>0)return;const c=r.val*.06;if(c>G.cash)return toast('Trésorerie insuffisante','bad');
  G.cash-=c;r.cost+=c;r.st=1;r.val*=1.04;log('🧰 Travaux au '+r.n+' ('+CITIES[r.c].n+') : '+eur(c,1));after();}
function buildRe(k){const r=curRe();if(!r||!r.own||r.k!=='land'||r.bl>0||!RE[k]||!RE[k].bk)return;const c=r.val*RE[k].bk;
  if(c>G.cash)return toast('Trésorerie insuffisante','bad');
  G.cash-=c;r.cost+=c;r.bcost=c;r.bk=k;r.bl=RE[k].bm;G.nBuild++;
  log('🏗️ Début du chantier au '+r.n+' ('+CITIES[r.c].n+') : '+RE[k].n.toLowerCase()+', '+eur(c,1)+', livraison dans '+RE[k].bm+' mois');after();}
function after(){mapDirty=true;computeStats();checkGoals();save();refresh(false);}

     .forEach(([t,f])=>{const b=L.DomUtil.create('button','',d);b.type='button';b.textContent=t;b.addEventListener('click',f);});

const inFilter=b=>!ui.rf.size&&(!ui.sf.size||ui.sf.has(b.s));
const inReFilter=r=>!ui.sf.size&&(!ui.rf.size||ui.rf.has(r.k));
function drawMap(){
  if(!map)return;mapDirty=false;layer.clearLayers();const z=map.getZoom();
  if(z<12){
    const cnt=CITIES.map(()=>[0,0]);for(const b of G.biz)if(inFilter(b)){cnt[b.c][0]++;if(b.own>0)cnt[b.c][1]++;}
    for(const r of G.re)if(inReFilter(r)){cnt[r.c][0]++;if(r.own)cnt[r.c][1]++;}
    CITIES.forEach((C,i)=>{const n=cnt[i][0];if(!n)return;const sz=Math.round(24+Math.sqrt(n)*3.2);
      const lab=(z>=7||C.p>=250)?`<span class="cl">${C.n}</span>`:'';
      const m=L.marker([C.la,C.lo],{icon:L.divIcon({html:`<div class="cb${cnt[i][1]?' own':''}">${n}</div>${lab}`,iconSize:[sz,sz],iconAnchor:[sz/2,sz/2]}),title:C.n,zIndexOffset:cnt[i][1]?500:0});
      m.on('click',()=>map.setView([C.la,C.lo],C.p>400?13:14));layer.addLayer(m);});
  }else{
    const bb=map.getBounds().pad(.15),gems=G.staff.ana>=2;
    for(const b of G.biz){if(!inFilter(b)||!bb.contains([b.la,b.lo]))continue;const S=SECT[b.s];
      const m=L.marker([b.la,b.lo],{icon:L.divIcon({html:`<div class="mk${b.own?' own':''}${b.id===ui.sel?' sel':''}" style="background:${S.c}">${S.e}${gems&&isGem(b)?'<em>✨</em>':''}${b.own?`<s>${b.own} %</s>`:''}</div>`,iconSize:[30,30],iconAnchor:[15,15]}),zIndexOffset:b.id===ui.sel?1000:b.own?500:0});
      m.bindTooltip(`<b>${b.n}</b><br>${S.n} · CA ${eur(b.ca)} · marge ${pc(b.ma)}`,{direction:'top',offset:[0,-14]});
      m.on('click',()=>select(b.id,false));layer.addLayer(m);}
    for(const r of G.re){if(!inReFilter(r)||!bb.contains([r.la,r.lo]))continue;const T=RE[r.k];
      const m=L.marker([r.la,r.lo],{icon:L.divIcon({html:`<div class="mk sq${r.own?' own':''}${r.id===ui.selR?' sel':''}" style="background:#3b4a5f">${r.bl>0?'🏗️':T.e}${r.own?'<s>à vous</s>':''}</div>`,iconSize:[30,30],iconAnchor:[15,15]}),zIndexOffset:r.id===ui.selR?1000:r.own?500:-100});
      m.bindTooltip(`<b>${T.n}</b> · ${r.n}<br>Prix ${eur(r.val)} · loyer ${eur(r.rent*(.8+.2*r.st))}/an`,{direction:'top',offset:[0,-14]});
      m.on('click',()=>selectRe(r.id,false));layer.addLayer(m);}
  }
}
function selectRe(id,fly){const r=G.re.find(x=>x.id===id);if(!r)return;ui.selR=id;ui.sel=null;
  if(map&&fly){if(map.getZoom()<13||!map.getBounds().pad(-.15).contains([r.la,r.lo]))map.setView([r.la,r.lo],Math.max(map.getZoom(),15));}
  drawMap();renderCard();$('#card').scrollTop=0;}
function select(id,fly){const b=byId(id);if(!b)return;ui.sel=id;ui.selR=null;ui.buy=clamp(10,1,Math.max(1,b.max-b.own));ui.sell=Math.max(1,b.own);
  if(map&&fly){if(map.getZoom()<13||!map.getBounds().pad(-.15).contains([b.la,b.lo]))map.setView([b.la,b.lo],Math.max(map.getZoom(),15));}

  if(ui.selR!=null){const r=curRe();if(r){renderReCard(el,r);return;}ui.selR=null;}
  const b=ui.sel!=null?byId(ui.sel):null;if(!b){el.hidden=true;return;}
  el.hidden=false;const S=SECT[b.s],st=SS[b.s],v=valo(b),C=CITIES[b.c],an=G.staff.ana;
  const rc=b.ca/st.ca,rm=st.mg>0?b.ma/st.mg:1,g=g12(b);
  const h=b.h,mn=Math.min(...h),mx=Math.max(...h),sp=(mx-mn)||1;
  const pts=h.map((x,i)=>`${i/(h.length-1)*300},${38-(x-mn)/sp*34}`).join(' ');
  const fx=G.fx.filter(f=>(f.sec&&f.sec[b.s])||f.ci===b.c);
  const maxBuy=b.max-b.own;
  let html=`<div class="hd"><div class="em" style="background:${S.c}">${S.e}</div><div><h2>${b.n}</h2><small>${S.n} · ${C.n} · depuis ${b.yr} · gérant : ${b.boss}</small></div><button class="x" data-a="close" title="Fermer">✕</button></div>
  <div class="kpis"><div class="kpi"><small>Chiffre d’affaires</small><b>${eur(b.ca)}</b></div><div class="kpi"><small>Marge nette</small><b class="${cls(b.ma)}">${pc(b.ma)}</b></div><div class="kpi"><small>Bénéfice / an</small><b class="${cls(b.ma)}">${eur(b.ca*b.ma)}</b></div>
  <div class="kpi"><small>Valorisation</small><b>${eur(v)}</b></div><div class="kpi"><small>Rendement</small><b class="gold">${pc(yld(b))}</b></div><div class="kpi"><small>Bénéfice distribué</small><b>${pc(b.pay,0)}</b></div></div>
  <div class="box"><h4>Comparaison avec son secteur (${st.n} entreprises en France)</h4>
   <div class="cmp"><div class="lab"><span>CA : ${eur(b.ca)} <small>(moyenne ${eur(st.ca)})</small></span><b class="${cls(rc-1)}">${rc>=1?'+':'−'}${pc(Math.abs(rc-1),0)}</b></div><div class="bar"><i style="width:${clamp(rc*50,3,100)}%"></i><u></u></div></div>
   <div class="cmp"><div class="lab"><span>Marge : ${pc(b.ma)} <small>(moyenne ${pc(st.mg)})</small></span><b class="${cls(b.ma-st.mg)}">${b.ma>=st.mg?'+':'−'}${nf(Math.abs(b.ma-st.mg)*100,1)} pt</b></div><div class="bar"><i style="width:${clamp(rm*50,3,100)}%"></i><u></u></div></div>
   <div class="lab" style="display:flex;justify-content:space-between;font-size:12px"><span>CA sur 24 mois</span><b class="${cls(g)}">${g>=0?'▲':'▼'} ${pc(Math.abs(g))} sur un an</b></div>
   <svg viewBox="0 0 300 40" preserveAspectRatio="none" style="width:100%;height:40px;display:block"><polyline points="${pts}" fill="none" stroke="#5aa9ff" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>
   <small>Trésorerie de l’entreprise : <span class="${cls(b.tre)}">${eur(b.tre)}</span></small></div>
  <div class="box"><h4>🔎 Avis de l’analyste</h4>${an>=1?`<div class="line"><span>Potentiel de croissance</span><b class="gold">${stars(b)}</b></div>`:''}${an>=2?`<div class="line"><span>Qualité de gestion</span><b>${grade(b)}${isGem(b)?' · ✨ pépite':''}</b></div>`:''}${an<1?`<span class="lock">🔒 Embauchez un analyste dans votre holding pour connaître le potentiel caché de cette entreprise.</span>`:an<2?`<span class="lock">🔒 Analyste confirmé : note de gestion et pépites.</span>`:''}</div>
  ${fx.length?`<div class="box"><h4>📰 Actualités qui la touchent</h4>${fx.map(f=>`<div class="log">${f.t} <small>(${f.left} mois)</small></div>`).join('')}</div>`:''}`;
  if(b.own>0){const mv=v*b.own/100;
    html+=`<div class="box" style="border-color:var(--gold)"><h4>💼 Votre participation : ${b.own} %</h4>
    <div class="line"><span>Valeur de vos parts</span><b>${eur(mv,1)}</b></div><div class="line"><span>Investi</span><b>${eur(b.cost,1)}</b></div>
    <div class="line"><span>Plus-value latente</span><b class="${cls(mv-b.cost)}">${sgn(mv-b.cost)}</b></div>
    <div class="line"><span>Dividendes nets estimés</span><b class="pos">${eur(estDiv(b),1)}/an</b></div><div class="line"><span>Dividendes déjà reçus</span><b>${eur(b.divs,1)}</b></div></div>`;}
  if(b.own>=50){
    html+=`<div class="box"><h4>🎛️ Vous dirigez (majoritaire)</h4>
    <div class="qrow"><span>Part du bénéfice distribuée</span><b id="lPay">${pc(b.pay,0)}</b></div><input type="range" id="rPay" min="0" max="100" step="5" value="${Math.round(b.pay*100)}">
    <small>Ce qui n’est pas distribué reste dans l’entreprise et finance sa croissance.</small>
    <div class="btns" style="margin-top:8px"><button class="btn sec sm" data-a="mk" ${b.mk>0||G.cash<b.ca*.04?'disabled':''}>📣 Marketing ${b.mk>0?`(${b.mk} mois restants)`:`(${eur(b.ca*.04)})`}</button>
    <button class="btn sec sm" data-a="reno" ${G.t<b.rn||G.cash<b.ca*.12?'disabled':''}>🏗️ Rénover ${G.t<b.rn?'(déjà fait)':`(${eur(b.ca*.12)})`}</button>
    ${b.tre<0?`<button class="btn red sm" data-a="recap" ${G.cash<-b.tre?'disabled':''}>🩹 Recapitaliser (${eur(-b.tre)})</button>`:''}</div>
    <small>Marketing : +10 %/an de croissance pendant 12 mois. Rénovation : meilleure gestion et +4 % de CA.</small></div>`;}
  html+=`<div class="box"><h4>Acheter des parts</h4>${maxBuy>0?`<div class="qrow"><span>Part à acheter</span><b id="lBuy"></b></div>
    <input type="range" id="rBuy" min="1" max="${maxBuy}" step="1" value="${clamp(ui.buy,1,maxBuy)}">
    <div class="chips">${[5,10,25].filter(x=>x<=maxBuy).map(x=>`<span class="chip" data-a="cbuy" data-v="${x}">${x} %</span>`).join('')}${b.own<50&&b.max>=50?`<span class="chip" data-a="cbuy" data-v="${50-b.own}">Majorité</span>`:''}<span class="chip" data-a="cbuy" data-v="max">Max</span></div>
    <div id="qBuy"></div><button class="btn" id="bBuy" data-a="buy" style="margin-top:8px">Acheter</button>
    <small>${b.max<100?`Le gérant garde ${b.max===49?'le contrôle':'la main'} : capital ouvert jusqu’à ${b.max} %.`:'Le gérant est prêt à céder jusqu’à 100 % du capital.'}</small>`
    :`<span class="mut">${b.own>=100?'Vous possédez 100 % du capital.':`Le gérant ne vend pas plus de ${b.max} % du capital.`}</span>`}</div>`;
  if(b.own>0)html+=`<div class="box"><h4>Vendre des parts</h4><div class="qrow"><span>Part à vendre</span><b id="lSell"></b></div>
    <input type="range" id="rSell" min="1" max="${b.own}" step="1" value="${clamp(ui.sell,1,b.own)}"><div id="qSell"></div>
    <button class="btn sec" data-a="sell" id="bSell" style="margin-top:8px">Vendre</button></div>`;
  el.innerHTML=html;updBuy();updSell();
}
function updBuy(){const b=byId(ui.sel),r=$('#rBuy');if(!b||!r)return;ui.buy=+r.value;const q=quoteBuy(b,ui.buy),af=b.own+ui.buy;
  const dv=Math.max(0,b.ca*b.ma)*b.pay*ui.buy/100*(1-divTax(af));
  $('#lBuy').textContent=ui.buy+' %';
  $('#qBuy').innerHTML=`<div class="qrow"><span>Prix total</span><b>${eur(q.total,1)}</b></div><small>Parts ${eur(q.price)} + frais ${eur(q.fees)}${q.ctrl?` + prime de contrôle ${eur(q.ctrl)}`:''}<br>Dividende net estimé : ≈ ${eur(dv,1)}/an (impôt ${tx(divTax(af))})</small>`;
  const bt=$('#bBuy'),no=q.total>G.cash;bt.disabled=no;bt.textContent=no?'Trésorerie insuffisante':'Acheter '+ui.buy+' %';}
function updSell(){const b=byId(ui.sel),r=$('#rSell');if(!b||!r)return;ui.sell=+r.value;const q=quoteSell(b,ui.sell);
  $('#lSell').textContent=ui.sell+' %';
  $('#qSell').innerHTML=`<div class="qrow"><span>Net encaissé</span><b>${eur(q.net,1)}</b></div><small>Plus-value ${sgn(q.gain)} · impôt ${eur(q.tax,1)} (${tx(pvTax(b))}) · frais de cession 3 %</small>`;
  $('#bSell').textContent='Vendre '+ui.sell+' %';}
function maxAffordable(b){for(let p=b.max-b.own;p>=1;p--)if(quoteBuy(b,p).total<=G.cash)return p;return 1;}

/* ---------- Fenêtres ---------- */
function modal(html){$('#modalIn').innerHTML=html;$('#modal').hidden=false;}
function closeModal(){$('#modal').hidden=true;}
function help(first){modal(`<h2>📈 InvestFront <span class="tag">alpha</span></h2>
 <p>Vous êtes investisseur. La France compte ${G.biz.length} commerces (tous fictifs) : restaurants, boulangeries, magasins de sport, pharmacies… Chacun a son chiffre d’affaires et sa rentabilité.</p>
 <ul><li><b>Explorez la carte</b> : cliquez sur une ville, puis sur un commerce pour voir ses chiffres et les comparer à la moyenne de son secteur.</li>
 <li><b>Achetez des parts</b> du capital. Chaque fin de trimestre, l’entreprise vous verse une partie de son bénéfice en <b>dividendes</b>.</li>
 <li><b>Investissez dans la pierre</b> : les carrés de la carte sont des locaux, immeubles, bureaux, entrepôts et terrains. Ils rapportent des <b>loyers</b> chaque mois, s’achètent à crédit, et un terrain peut être bâti.</li>
 <li><b>Empruntez à la banque</b> pour aller plus vite : elle prête selon votre patrimoine et vos revenus.</li>
 <li><b>Devenez majoritaire</b> (50 %) pour décider des dividendes, lancer du marketing ou rénover.</li>
 <li><b>Créez votre holding</b> pour payer moins d’impôts et embaucher : directeur des opérations, fiscaliste, analyste, directeur financier.</li>
 <li><b>Surveillez l’actualité</b> : canicule, travaux, hausse des taux… tout bouge, et une entreprise mal en point peut faire faillite.</li></ul>
 <p class="mut">Vitesse du jeu en haut à droite (ou touches espace, 1, 2, 3). La partie est sauvegardée dans votre navigateur.</p>
 <button class="btn" data-a="closem">${first?'Commencer avec '+eur(G.cash,1):'Reprendre'}</button>`);}

/* ---------- Événements d'interface ---------- */
function setSpeed(v){if(G.over)return;speed=v;renderTop();}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]');if(!t)return;const d=t.dataset;
  switch(d.a){
    case 'spd':setSpeed(+d.v);break;
    case 'tab':ui.tab=d.v;ui.sel=null;ui.selR=null;refresh(false);$('#view').scrollTop=0;break;
    case 'close':ui.sel=null;ui.selR=null;renderCard();drawMap();break;
    case 'selr':selectRe(+d.id,true);break;
    case 'buyre':buyRe(d.m==='1');break;
    case 'sellre':sellRe();break;
    case 'renore':renoRe();break;
    case 'build':buildRe(d.k);break;
    case 'mkt':ui.mkt=d.v;ui.sf.clear();ui.rf.clear();renderView();drawMap();$('#view').scrollTop=0;break;
    case 'rfil':ui.rf.has(d.k)?ui.rf.delete(d.k):ui.rf.add(d.k);renderView();drawMap();break;
    case 'rfclear':ui.rf.clear();renderView();drawMap();break;
    case 'sel':select(+d.id,true);break;
    case 'buy':buy();break;
    case 'sell':sell();break;
    case 'cbuy':{const b=byId(ui.sel),r=$('#rBuy');if(!b||!r)break;r.value=clamp(d.v==='max'?maxAffordable(b):+d.v,1,b.max-b.own);updBuy();break;}
    case 'mk':marketing();break;
    case 'reno':renovate();break;
    case 'recap':recap();break;
    case 'sfil':ui.sf.has(d.k)?ui.sf.delete(d.k):ui.sf.add(d.k);renderView();drawMap();break;
    case 'sfclear':ui.sf.clear();renderView();drawMap();break;
    case 'sectgo':ui.rf.clear();ui.sf.clear();ui.sf.add(d.k);ui.mkt='biz';ui.tab='market';refresh(false);break;
    case 'hold':createHolding();break;
    case 'hire':hire(d.k);break;
    case 'fire':fire(d.k);break;
    case 'loan':takeLoan();break;
    case 'repay':repay(+d.id);break;
    case 'help':help(false);break;
    case 'closem':closeModal();if(!G.seen){G.seen=true;setSpeed(1);save();}break;
    case 'reset':modal(`<h2>Nouvelle partie ?</h2><p>La partie en cours sera effacée et une nouvelle France sera générée.</p><div class="btns"><button class="btn red sm" data-a="reset2">Oui, recommencer</button><button class="btn sec sm" data-a="closem">Annuler</button></div>`);break;
    case 'reset2':closeModal();speed=0;ui.sel=null;ui.selR=null;ui.sf.clear();ui.rf.clear();ui.mkt='biz';ui.tab='dash';newGame();save();if(map)map.setView([46.6,2.6],6);refresh(false);help(true);break;
  }
});
document.addEventListener('input',e=>{const id=e.target.id;
  if(id==='rBuy')updBuy();else if(id==='rSell')updSell();else if(id==='rLoan')updLoan();
  else if(id==='rPay'){const b=byId(ui.sel);if(b&&b.own>=50){b.pay=+e.target.value/100;$('#lPay').textContent=pc(b.pay,0);}}});
document.addEventListener('change',e=>{const id=e.target.id;
  if(id==='selSort'){ui.sort=e.target.value;e.target.blur();renderView();}
  else if(id==='selSortR'){ui.sortR=e.target.value;e.target.blur();renderView();}
  else if(id==='selYrs'){ui.loanYrs=+e.target.value;e.target.blur();updLoan();}
  else if(id==='rPay'){save();renderCard();}});
document.addEventListener('pointerdown',e=>{if(e.target.matches&&e.target.matches('input[type=range]'))dragging=true;});
['pointerup','pointercancel'].forEach(ev=>document.addEventListener(ev,()=>{dragging=false;}));
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT'||!$('#modal').hidden)return;
  if(e.code==='Space'){e.preventDefault();setSpeed(speed?0:1);}else if(e.key==='1')setSpeed(1);else if(e.key==='2')setSpeed(2);else if(e.key==='3')setSpeed(3);else if(e.key==='Escape'&&(ui.sel!=null||ui.selR!=null)){ui.sel=null;ui.selR=null;renderCard();drawMap();}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G)save();});
window.addEventListener('beforeunload',()=>{if(G)save();});

/* ---------- Horloge ---------- */
let last=performance.now(),acc=0;
setInterval(()=>{const now=performance.now(),dt=Math.min(now-last,400);last=now;
  if(!G||G.over||!speed)return;acc+=dt*SPEEDS[speed];let n=0;
  while(acc>=DAY_MS&&n<60){acc-=DAY_MS;G.t++;n++;if(G.t%30===0){endMonth();if(G.over)return;}}
  if(n)renderTop();},50);

/* ---------- Démarrage ---------- */
const resumed=load();if(!resumed)newGame();
computeStats();initMap();refresh(false);
if(!G.seen)help(true);else if(G.over)gameOver();
else if(upgraded){save();toast('🆕 Nouveautés : immobilier à louer ou à bâtir, et région Centre-Val de Loire densifiée','gold');}
window.addEventListener('resize',()=>{if(map)map.invalidateSize();});
</script>
</body>
</html>
